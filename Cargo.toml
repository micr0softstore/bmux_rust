[package]
name = "bmux"
version = "1.2.5"
edition = "2024"
rust-version = "1.88"
description = "A calm, workspace-oriented terminal for Linux and Windows"
repository = "https://github.com/imbencetsx/bmux"
build = "build.rs"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
portable-pty = "0.9"
vt100 = "0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
shell-words = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
open = "5"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
